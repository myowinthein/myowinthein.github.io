<main>
  <section aria-labelledby="projects-title">
    <h2 class="visually-hidden" id="projects-title">Projects</h2>

      <p class="loading"><a class="external-link" href="https://github.com/myowinthein?tab=repositories">Browse my public repositories on GitHub</a>.</p>
    </div>

    <div class="project-controls">
      <p class="loading" id="project-status" role="status" aria-atomic="true"></p>
      <button class="load-more" id="load-more" type="button" aria-controls="grid" hidden>Load more</button>
    </div>
  </section>
